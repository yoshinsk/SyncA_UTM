{% extends "base.html" %}
{% block title %}UPnP - SyncA UTM{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="h3 mb-0 d-flex align-items-center gap-2">
        <i class="bi bi-router text-primary"></i> UPnP / NAT-PMP
    </h1>
    <button class="btn btn-outline-secondary btn-sm" onclick="loadUpnp()">
        <i class="bi bi-arrow-clockwise"></i> ???
    </button>
</div>

<div class="alert alert-warning d-flex align-items-start gap-2 small" role="alert">
    <i class="bi bi-exclamation-triangle-fill mt-1"></i>
    <div>UPnP ? LAN ???????????? WAN ???????????????????????????????????????????</div>
</div>

<div class="row g-3">
    <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white d-flex align-items-center gap-2">
                <i class="bi bi-activity text-secondary"></i>
                <strong>??</strong>
            </div>
            <div class="card-body">
                <div id="upnp-status" class="d-flex flex-column gap-2 small"></div>
            </div>
        </div>
    </div>
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white d-flex align-items-center gap-2">
                <i class="bi bi-sliders text-secondary"></i>
                <strong>??</strong>
            </div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input id="upnp-enabled" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="upnp-enabled">UPnP ????</label>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small mb-1">WAN interface</label>
                        <select id="upnp-wan" class="form-select form-select-sm font-monospace"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small mb-1">Control port</label>
                        <input id="upnp-control-port" type="number" min="1024" max="65535" class="form-control form-control-sm font-monospace" value="5000">
                    </div>
                    <div class="col-12">
                        <label class="form-label small mb-1">LAN listening interfaces</label>
                        <div id="upnp-lan-list" class="d-flex flex-column gap-1 border rounded p-2 bg-light"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label small mb-1">Allowed LAN CIDR</label>
                        <textarea id="upnp-cidrs" class="form-control form-control-sm font-monospace" rows="3" placeholder="172.17.17.0/24"></textarea>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check">
                            <input id="upnp-igd" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="upnp-igd">UPnP IGD</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check">
                            <input id="upnp-natpmp" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="upnp-natpmp">NAT-PMP</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check">
                            <input id="upnp-secure" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="upnp-secure">Secure mode</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-primary btn-sm" onclick="saveUpnp()">
                        <i class="bi bi-check2"></i> ??????
                    </button>
                    <button class="btn btn-outline-danger btn-sm" onclick="disableUpnp()">
                        <i class="bi bi-power"></i> ???
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm mt-3">
    <div class="card-header bg-white d-flex align-items-center gap-2">
        <i class="bi bi-list-check text-secondary"></i>
        <strong>SyncA ?? firewalld rules</strong>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 small align-middle">
                <thead class="table-light">
                    <tr>
                        <th>rule</th>
                    </tr>
                </thead>
                <tbody id="upnp-rules"></tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let upnpState = null;

function badge(text, ok) {
    return `<span class="badge ${ok ? 'bg-success-subtle text-success-emphasis' : 'bg-secondary-subtle text-secondary-emphasis'}">${escapeHtml(text)}</span>`;
}

function interfaceLabel(item) {
    const cidrs = (item.cidrs || []).join(', ');
    const suffix = cidrs ? ` ${cidrs}` : '';
    return `${item.name}${suffix}`;
}

async function loadUpnp() {
    const data = await api.get('/upnp/api/status');
    if (!data) return;
    upnpState = data;
    renderStatus(data);
    renderForm(data);
    renderRules(data.managed_firewall_rules || []);
}

function renderStatus(data) {
    const settings = data.settings || {};
    const service = data.service || {};
    const daemon = data.daemon || {};
    const firewalld = data.firewalld || {};
    const status = document.getElementById('upnp-status');
    status.innerHTML = `
        <div class="d-flex justify-content-between gap-2"><span>??</span>${badge(settings.enabled ? 'enabled' : 'disabled', settings.enabled)}</div>
        <div class="d-flex justify-content-between gap-2"><span>synca-upnp</span>${badge(`${service.active || 'unknown'} / ${service.enabled || 'unknown'}`, service.active === 'active')}</div>
        <div class="d-flex justify-content-between gap-2"><span>daemon</span>${badge(daemon.installed ? 'installed' : 'missing', daemon.installed)}</div>
        <div class="d-flex justify-content-between gap-2"><span>firewalld</span>${badge(firewalld.active ? 'active' : 'inactive', firewalld.active)}</div>
        <div><span class="text-secondary">config:</span> <code>${escapeHtml(data.config_path || '')}</code></div>
        <div><span class="text-secondary">daemon:</span> <code>${escapeHtml(daemon.path || '')}</code></div>
        <div><span class="text-secondary">WAN:</span> <code>${escapeHtml((settings.wan_interface || data.detected_wan_interfaces?.[0] || '-'))}</code></div>
        <div><span class="text-secondary">LAN:</span> <code>${escapeHtml((settings.lan_interfaces || []).join(', ') || (data.detected_lan_interfaces || []).join(', ') || '-')}</code></div>
    `;
}

function renderForm(data) {
    const settings = data.settings || {};
    const interfaces = data.interfaces || [];
    const detectedWan = data.detected_wan_interfaces || [];
    const detectedLan = data.detected_lan_interfaces || [];
    const selectedWan = settings.wan_interface || detectedWan[0] || '';
    const selectedLan = (settings.lan_interfaces && settings.lan_interfaces.length > 0)
        ? settings.lan_interfaces
        : detectedLan;

    document.getElementById('upnp-enabled').checked = !!settings.enabled;
    document.getElementById('upnp-control-port').value = settings.control_port || 5000;
    document.getElementById('upnp-igd').checked = settings.enable_upnp !== false;
    document.getElementById('upnp-natpmp').checked = settings.enable_natpmp !== false;
    document.getElementById('upnp-secure').checked = settings.secure_mode !== false;
    document.getElementById('upnp-cidrs').value = (settings.allowed_cidrs || []).join('\n');

    const wanSelect = document.getElementById('upnp-wan');
    wanSelect.innerHTML = interfaces.length === 0
        ? '<option value="">interface not detected</option>'
        : interfaces.map(item => {
            const selected = item.name === selectedWan ? 'selected' : '';
            const mark = item.is_wan_default ? ' [default route]' : '';
            return `<option value="${escapeHtml(item.name)}" ${selected}>${escapeHtml(interfaceLabel(item) + mark)}</option>`;
        }).join('');

    const lanWrap = document.getElementById('upnp-lan-list');
    const lanItems = interfaces.filter(item => item.name !== selectedWan && item.name !== 'lo');
    lanWrap.innerHTML = lanItems.length === 0
        ? '<div class="text-secondary small">LAN interface not detected</div>'
        : lanItems.map(item => {
            const checked = selectedLan.includes(item.name) ? 'checked' : '';
            const id = `upnp-lan-${item.name.replace(/[^A-Za-z0-9_-]/g, '-')}`;
            return `
                <div class="form-check">
                    <input class="form-check-input upnp-lan-check" type="checkbox" value="${escapeHtml(item.name)}" id="${escapeHtml(id)}" ${checked}>
                    <label class="form-check-label font-monospace small" for="${escapeHtml(id)}">${escapeHtml(interfaceLabel(item))}</label>
                </div>`;
        }).join('');
}

function renderRules(rules) {
    const tbody = document.getElementById('upnp-rules');
    tbody.innerHTML = rules.length === 0
        ? '<tr><td class="text-secondary text-center py-3">managed rule ??</td></tr>'
        : rules.map(rule => `<tr><td><code>${escapeHtml(rule)}</code></td></tr>`).join('');
}

function collectPayload(forceDisabled = false) {
    const lanInterfaces = Array.from(document.querySelectorAll('.upnp-lan-check:checked')).map(el => el.value);
    const cidrs = document.getElementById('upnp-cidrs').value.split(/\s+/).map(v => v.trim()).filter(Boolean);
    return {
        enabled: forceDisabled ? false : document.getElementById('upnp-enabled').checked,
        wan_interface: document.getElementById('upnp-wan').value,
        lan_interfaces: lanInterfaces,
        allowed_cidrs: cidrs,
        control_port: Number(document.getElementById('upnp-control-port').value || 5000),
        enable_upnp: document.getElementById('upnp-igd').checked,
        enable_natpmp: document.getElementById('upnp-natpmp').checked,
        secure_mode: document.getElementById('upnp-secure').checked,
    };
}

async function saveUpnp() {
    const res = await api.send('/upnp/api/config', 'POST', collectPayload());
    if (!res) return;
    toast(res.ok ? 'UPnP ?????????' : 'UPnP ????????????', !res.ok);
    await loadUpnp();
}

async function disableUpnp() {
    const res = await api.send('/upnp/api/config', 'POST', collectPayload(true));
    if (!res) return;
    toast(res.ok ? 'UPnP ????????' : 'UPnP ??????????', !res.ok);
    await loadUpnp();
}

document.getElementById('upnp-wan').addEventListener('change', () => {
    if (upnpState) renderForm(upnpState);
});

document.addEventListener('DOMContentLoaded', loadUpnp);
</script>
{% endblock %}
